name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "${ANDROID_SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='astro.neximage.probe'"
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neximage-probe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
